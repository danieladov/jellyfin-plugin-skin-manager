<!DOCTYPE html>
<html>

<head>
    <title>Skin Manager</title>
</head>

<body>
    <div id="skinManagerPage" data-role="page"
        class="page type-interior pluginConfigurationPage tbsConfigurationPage withTabs"
        data-require="emby-input,emby-button,emby-textarea" data-controller="__plugin/fontpicker.js">
        <script src="/web/configurationpage?name=controls.Control.js"></script>
        <script src="/web/configurationpage?name=controls.ColorControl.js"></script>
        <script src="/web/configurationpage?name=controls.SliderControl.js"></script>
        <script src="/web/configurationpage?name=controls.CheckBoxControl.js"></script>
        <script src="/web/configurationpage?name=controls.NumberControl.js"></script>
        <script src="/web/configurationpage?name=controls.SelectControl.js"></script>
        <script src="/web/configurationpage?name=controls.FontPickerControl.js"></script>
        <script src="/web/configurationpage?name=controls.TextAreaControl.js"></script>
        <script src="/web/configurationpage?name=controls.Category.js"></script>
        <script src="/web/configurationpage?name=skin.js"></script>
        <script src="/web/configurationpage?name=fontpicker.js"></script>
        <script src="/web/configurationpage?name=colorpicker.js"></script>
        <script src="/web/configurationpage?name=MainController.js"></script>
        <script src="/web/configurationpage?name=common.js"></script>
        <script src="/web/configurationpage?name=ConfigController.js"></script>


        <link rel="stylesheet" href="/web/configurationpage?name=style.css" />

        <div data-role="content">
            <div class="content-primary">
                <div class="tbsConfigurationPage skinManagerShell">
                    <section class="skinManagerHeader">
                        <div class="skinManagerHeader-main">
                            <h2 class="sectionTitle">Skin Manager</h2>
                            <p class="skinManagerLead">Choose a preset, tune it live and apply it when it is ready.</p>
                        </div>
                        <div class="skinManagerHeader-side">
                            <div class="skinCurrentState">
                                <span class="skinCurrentStateLabel">Current setup</span>
                                <strong class="skinCurrentStateValue" id="heroCurrentSkin">No skin saved yet</strong>
                                <p class="skinCurrentStateHint" id="heroCurrentSkinHint">Apply a preset to keep a recoverable
                                    history of your setup.</p>
                            </div>
                            <a is="emby-linkbutton" class="raised button-alt headerHelpButton emby-button skinManagerHelpButton"
                                target="_blank"
                                href="https://prayag17.github.io/jellyfin-plugin-skin-manager/src/html/help.html">Help
                                & tips</a>
                        </div>
                    </section>

                    <fieldset>
                        <legend>Choose a preset</legend>
                        <div class="skinSelectionIntro">
                                <p class="skinSelectionText">Pick a starting point and refine it below.</p>
                        </div>

                        <div class="skinSelectionGrid">
                            <div class="skinPickerField">
                                <label for="cssOptions">Available skins</label>
                                <div class="selectContainer skinPickerSelectContainer">
                                    <select is="emby-select" id="cssOptions"></select>
                                </div>
                                <div class="fieldDescription skinPickerDescription" id="description"></div>

                                <button is="emby-button" type="button" class="raised block skinApplyButton" id="setSkin">
                                    <span>Apply Skin</span>
                                </button>
                            </div>
                        </div>

                    </fieldset>

                    <div class="allOptions">
                        <div class="checkboxList checkboxList-verticalwrap" id="options"></div>
                    </div>

                    <div class="skinShareParking" id="skinShareParking">
                        <div class="skinShareTools" id="skinShareTools" aria-labelledby="skinShareTitle">
                            <h4 class="skinShareTitle" id="skinShareTitle">Share skins</h4>
                            <div class="skinShareColumns">
                                <div class="skinShareColumn">
                                    <label for="skinExportName">Export name</label>
                                    <input class="emby-input" id="skinExportName" type="text" autocomplete="off">

                                    <label for="skinExportDescription">Description</label>
                                    <textarea class="emby-textarea" id="skinExportDescription"
                                        rows="2"></textarea>

                                    <div class="skinShareActions">
                                        <button is="emby-button" type="button" class="raised skinShareButton skinShareButton-secondary"
                                            id="skinExportDownload">
                                            <span>Download JSON</span>
                                        </button>
                                        <button is="emby-button" type="button" class="raised skinShareButton skinShareButton-secondary"
                                            id="skinExportCopy">
                                            <span>Copy JSON</span>
                                        </button>
                                    </div>
                                    <p class="skinShareStatus" id="skinExportStatus" aria-live="polite"></p>
                                </div>

                                <div class="skinShareColumn">
                                    <label for="skinImportFile">Import skin</label>
                                    <input class="skinImportFile" id="skinImportFile" type="file"
                                        accept=".json,application/json">

                                    <textarea class="emby-textarea textarea-mono" id="skinImportText"
                                        rows="3" placeholder="Paste exported JSON here"></textarea>

                                    <button is="emby-button" type="button" class="raised skinShareButton skinShareButton-primary"
                                        id="skinImportButton">
                                        <span>Add to presets</span>
                                    </button>
                                    <p class="skinShareStatus" id="skinImportStatus" aria-live="polite"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script type="text/javascript">
            console.log("Main page loaded");
            const setSkinManagerTabs = function () {
                LibraryMenu.setTabs('skin manager', 0, getTabs);
            };
            if (!window.SkinManagerMainViewListener) {
                window.SkinManagerMainViewListener = function (e) {
                    if (e.target && e.target.id === 'skinManagerPage') {
                        setSkinManagerTabs();
                    }
                };
                document.addEventListener('viewshow', window.SkinManagerMainViewListener);
            }
            setSkinManagerTabs();

            const controller = new MainController("/web/configurationpage?name=skins.json");
            controller.init();
        </script>
    </div>
</body>

</html>
